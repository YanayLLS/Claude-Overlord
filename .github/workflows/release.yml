name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get version from package.json
        id: version
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=v$ver" >> $env:GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          $exists = git tag -l $tag
          if ($exists) { echo "EXISTS=true" >> $env:GITHUB_OUTPUT } else { echo "EXISTS=false" >> $env:GITHUB_OUTPUT }

      - name: Skip if version unchanged
        if: steps.check.outputs.EXISTS == 'true'
        run: echo "Tag ${{ steps.version.outputs.TAG }} already exists — skipping release"

      - name: Create git tag
        if: steps.check.outputs.EXISTS == 'false'
        run: |
          git tag ${{ steps.version.outputs.TAG }}
          git push origin ${{ steps.version.outputs.TAG }}

      - name: Install dependencies
        if: steps.check.outputs.EXISTS == 'false'
        run: npm ci

      - name: Build and publish
        if: steps.check.outputs.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      # electron-builder can create the GitHub release as a draft, which is invisible to
      # users and ignored by auto-update. Force it public + latest so releases actually ship.
      - name: Publish release (un-draft + mark latest)
        if: steps.check.outputs.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ steps.version.outputs.TAG }} --draft=false --latest --repo ${{ github.repository }}
