<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Overlord Remote</title>
<style>
:root {
  --bg: #1e1e2e; --bg2: #181825; --bg3: #252536; --border: #313244; --border-hi: #45475a;
  --accent: #89b4fa; --green: #a6e3a1; --text: rgba(205,214,244,.95); --dim: rgba(166,173,200,.5);
  --yellow: #f9e2af; --red: #f38ba8; --purple: #cba6f7; --cyan: #94e2d5;
  --shadow: #11111b; --card: #1e1e2e;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; min-height:100vh; background:var(--bg); color:var(--text);
  font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  font-size:14px; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
#header {
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; padding:12px 16px;
  background:var(--bg2); border-bottom:1px solid var(--border);
}
#header h1 { font-size:16px; font-weight:600; flex:1; }
#header h1 span { color:var(--accent); }
.status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; flex-shrink:0; }
.status-dot.connected { background:var(--green); }
.status-dot.disconnected { background:var(--red); }
#conn-label { font-size:11px; color:var(--dim); }

#agents { padding:8px; display:flex; flex-direction:column; gap:8px; }
.agent-card {
  background:var(--bg3); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; transition:border-color .15s;
}
.agent-card.selected { border-color:var(--accent); }
.agent-card-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.agent-title { font-size:14px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.agent-status {
  font-size:10px; padding:2px 8px; border-radius:10px; font-weight:500;
  letter-spacing:.3px; text-transform:uppercase; flex-shrink:0;
}
.agent-status.active { color:var(--accent); background:rgba(137,180,250,.12); border:1px solid rgba(137,180,250,.25); }
.agent-status.waiting { color:var(--green); background:rgba(166,227,161,.12); border:1px solid rgba(166,227,161,.25); }
.agent-status.permission { color:var(--yellow); background:rgba(249,226,175,.12); border:1px solid rgba(249,226,175,.25); }
.agent-cwd { font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:6px; }
.agent-preview {
  font-size:12px; color:var(--dim); line-height:1.5;
  max-height:60px; overflow:hidden; word-break:break-word;
  background:var(--bg2); border-radius:6px; padding:8px 10px;
  border:1px solid var(--border);
}
.agent-preview:empty { display:none; }
.agent-actions { display:flex; gap:8px; margin-top:8px; }
.agent-actions button {
  flex:1; font-family:inherit; font-size:12px; font-weight:500;
  padding:8px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg2); color:var(--text); cursor:pointer;
  transition:background .12s, border-color .12s;
  -webkit-tap-highlight-color:transparent;
}
.agent-actions button:active { background:var(--border); }
.btn-approve { color:var(--green) !important; border-color:rgba(166,227,161,.3) !important; background:rgba(166,227,161,.08) !important; }
.btn-approve:active { background:rgba(166,227,161,.2) !important; }
.btn-reject { color:var(--red) !important; border-color:rgba(243,139,168,.3) !important; background:rgba(243,139,168,.08) !important; }
.btn-reject:active { background:rgba(243,139,168,.2) !important; }

/* Input bar */
#input-bar {
  position:fixed; bottom:0; left:0; right:0;
  display:none; padding:8px 12px; gap:8px;
  background:var(--bg2); border-top:1px solid var(--border);
  align-items:center;
}
#input-bar.open { display:flex; }
#input-bar input {
  flex:1; font-family:inherit; font-size:14px; padding:10px 14px;
  background:var(--bg3); color:var(--text); border:1px solid var(--border);
  border-radius:10px; outline:none;
}
#input-bar input:focus { border-color:var(--accent); }
#input-bar button {
  font-family:inherit; font-size:13px; font-weight:600; padding:10px 18px;
  background:var(--accent); color:var(--shadow); border:none; border-radius:10px;
  cursor:pointer; flex-shrink:0;
}
#input-bar button:active { opacity:.8; }
#target-name {
  font-size:11px; color:var(--accent); font-weight:500; flex-shrink:0;
  max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.empty {
  text-align:center; padding:60px 20px; color:var(--dim);
  font-size:14px; letter-spacing:.2px;
}
</style>
</head>
<body>
<div id="header">
  <h1><span>Overlord</span> Remote</h1>
  <span class="status-dot disconnected" id="conn-dot"></span>
  <span id="conn-label">Connecting...</span>
</div>
<div id="agents">
  <div class="empty">Connecting to Overlord...</div>
</div>
<div id="input-bar">
  <span id="target-name"></span>
  <input type="text" id="input-text" placeholder="Send a message..." autocomplete="off" />
  <button onclick="sendInput()">Send</button>
</div>

<script>
const basePath = location.pathname.replace(/\/$/, '');
let agentData = [];
let selectedId = null;
let es = null;

function connect() {
  if (es) { try { es.close(); } catch {} }
  es = new EventSource(basePath + '/events');
  es.onopen = () => {
    document.getElementById('conn-dot').className = 'status-dot connected';
    document.getElementById('conn-label').textContent = 'Connected';
  };
  es.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') { agentData = msg.agents; render(); }
    } catch {}
  };
  es.onerror = () => {
    document.getElementById('conn-dot').className = 'status-dot disconnected';
    document.getElementById('conn-label').textContent = 'Reconnecting...';
  };
}

function render() {
  const el = document.getElementById('agents');
  if (agentData.length === 0) {
    el.innerHTML = '<div class="empty">No active agents</div>';
    document.getElementById('input-bar').classList.remove('open');
    return;
  }
  el.innerHTML = agentData.map(a => {
    const st = a.status || 'active';
    const shortCwd = a.cwd.replace(/\\/g, '/').split('/').slice(-2).join('/');
    const sel = a.id === selectedId;
    const isPermission = st === 'permission';
    return `<div class="agent-card${sel ? ' selected' : ''}" onclick="selectAgent(${a.id})">
      <div class="agent-card-header">
        <div class="agent-title">${esc(a.agentName || a.title || 'Agent ' + a.id)}</div>
        <div class="agent-status ${st}">${st}</div>
      </div>
      <div class="agent-cwd">${esc(shortCwd)}</div>
      <div class="agent-preview">${esc(a.preview)}</div>
      ${isPermission ? `<div class="agent-actions">
        <button class="btn-approve" onclick="event.stopPropagation();approve(${a.id})">Approve</button>
        <button class="btn-reject" onclick="event.stopPropagation();reject(${a.id})">Reject</button>
      </div>` : ''}
    </div>`;
  }).join('');

  const bar = document.getElementById('input-bar');
  if (selectedId !== null) {
    bar.classList.add('open');
    const a = agentData.find(x => x.id === selectedId);
    document.getElementById('target-name').textContent = a ? (a.agentName || a.title || 'Agent') : '';
  } else {
    bar.classList.remove('open');
  }
}

function selectAgent(id) {
  selectedId = selectedId === id ? null : id;
  render();
  if (selectedId !== null) {
    setTimeout(() => document.getElementById('input-text').focus(), 100);
  }
}

async function sendInput() {
  if (selectedId === null) return;
  const inp = document.getElementById('input-text');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  try {
    await fetch(basePath + '/input', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: selectedId, text }),
    });
  } catch {}
}

async function approve(id) {
  try {
    await fetch(basePath + '/approve', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
  } catch {}
}

async function reject(id) {
  try {
    await fetch(basePath + '/reject', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
  } catch {}
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Enter key sends input
document.getElementById('input-text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendInput(); }
});

connect();
</script>
</body>
</html>
